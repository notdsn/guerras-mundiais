<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Guerras Mundiais — 1914 até Hoje</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<canvas id="mapa"></canvas>
<div id="vinheta"></div>
<div id="hud" class="oculto">
  <div class="hud-l1">
    <button id="hudNac" class="hud-nac"><span id="hudBand" class="band"></span><span><b id="hudNome">—</b><small id="hudEra">1ª GUERRA</small></span></button>
    <div class="hud-data"><b id="hudData">28 jul 1914</b><small id="hudAno"></small></div>
    <div id="vel" class="vel"><button id="btPlay" aria-label="Pausar ou continuar"></button><button id="btVel" aria-label="Velocidade">1×</button></div>
  </div>
  <div class="hud-l2">
    <div class="rc" id="rcDin"></div><div class="rc" id="rcPet"></div>
    <button id="btRef" class="rc ref oculto"></button>
    <button id="btImp" class="rc imp oculto"></button><button id="btAm" class="rc am"></button>
  </div>
</div>
<button id="missao" class="missao oculto"></button>
<div id="botoesMapa" class="oculto"><button id="zMais" aria-label="Aproximar">+</button><button id="zMenos" aria-label="Afastar">−</button><button id="zCasa" aria-label="Ir para a capital">★</button></div>
<div id="dica" class="dica oculto"></div>
<div id="sheet" class="sheet oculto"><div class="alca"></div><div id="sheetC"></div></div>
<div id="atq" class="atq oculto"><div id="atqC"></div></div>
<div id="res" class="res oculto"></div>
<div id="painel" class="painel oculto"><div class="painel-top"><h2 id="painelT"></h2><button class="x" id="painelX" aria-label="Fechar">✕</button></div><div id="painelC" class="painel-c"></div></div>
<nav id="nav" class="oculto">
  <button data-p="mapa" class="ativo"><i data-ic="mapa"></i><span>Mapa</span></button>
  <button data-p="pesquisa"><i data-ic="pesquisa"></i><span>Pesquisa</span></button>
  <button data-p="diplo"><i data-ic="diplo"></i><span>Diplomacia</span><em id="bDiplo" class="badge oculto"></em></button>
  <button data-p="noticias"><i data-ic="noticias"></i><span>Notícias</span><em id="bNews" class="badge oculto"></em></button>
  <button data-p="menu"><i data-ic="menu"></i><span>Menu</span></button>
</nav>
<div id="toasts"></div>
<div id="modal" class="modal oculto"><div class="modal-c" id="modalC"></div></div>
<div id="cine" class="cine oculto"></div>
<div id="inicio" class="inicio">
  <div class="inicio-fundo"></div>
  <div class="inicio-c">
    <div class="logo"><small>CAMPANHA MUNDIAL</small><h1>GUERRAS<br>MUNDIAIS</h1><div class="eras-linha"><span>1914</span><i></i><span>1939</span><i></i><span>1947</span><i></i><span>1991</span><i></i><span>HOJE</span></div></div>
    <p class="inicio-sub">Escolha seu país, ataque as cidades vizinhas e atravesse todas as guerras: das trincheiras de 1914 aos drones de hoje.</p>
    <div class="inicio-bts">
      <button id="btContinuar" class="bt bt-ouro oculto">Continuar campanha</button>
      <button id="btNovo" class="bt bt-ouro">Nova campanha</button>
      <button id="btComo" class="bt">Como jogar</button>
    </div>
    <p class="versao">Carregando mapa…</p>
  </div>
</div>
<div id="escolha" class="escolha oculto"></div>
<script src="js/geo.js?v=5"></script>
<script src="js/data.js?v=5"></script>
<script src="js/art.js?v=5"></script>
<script src="js/jogo.js?v=5"></script>
<script src="js/map.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
</body>
</html>
